services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: syncwatch-postgres
    environment:
      POSTGRES_DB: syncAppBase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: himtUn32
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - syncwatch-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: syncwatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - syncwatch-network

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncwatch-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: syncAppBase
      DB_USER: postgres
      DB_PASSWORD: himtUn32
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: your-super-secret-refresh-key
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - syncwatch-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncwatch-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_WS_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - syncwatch-network

volumes:
  postgres_data:
  redis_data:


networks:
  syncwatch-network:
    driver: bridge
